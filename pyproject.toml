[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sentinel"
dynamic = ["version"]
description = "Security layer for AI agents and MCP servers: a default-deny policy for tool calls, prompt-injection scanning, poisoned-tool quarantine, a secret guard and an audit log."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "ai", "llm", "agents", "ai-agents", "security", "ai-security", "llm-security", "agent-security",
    "mcp", "model-context-protocol", "mcp-security", "mcp-proxy", "prompt-injection", "tool-poisoning",
    "guardrails", "firewall", "tool-calls", "secrets", "audit-log", "claude-code", "hooks",
]
# The Python versions listed are the ones the tests run on (.github/workflows/tests.yml).
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://farooqazamdogar.github.io/agent-sentinel/"
Documentation = "https://github.com/FarooqAzamdogar/agent-sentinel#readme"
Source = "https://github.com/FarooqAzamdogar/agent-sentinel"
Changelog = "https://github.com/FarooqAzamdogar/agent-sentinel/blob/main/CHANGELOG.md"
Issues = "https://github.com/FarooqAzamdogar/agent-sentinel/issues"
Security = "https://github.com/FarooqAzamdogar/agent-sentinel/blob/main/SECURITY.md"

[project.scripts]
agent-sentinel = "agent_sentinel.__main__:main"

[tool.setuptools]
packages = ["agent_sentinel"]

# The version lives in one place: agent_sentinel/__init__.py
[tool.setuptools.dynamic]
version = { attr = "agent_sentinel.__version__" }
