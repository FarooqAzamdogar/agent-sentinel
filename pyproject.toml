[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sentinel"
dynamic = ["version"]
description = "Security sentinel for AI agents and MCP servers: blocks unsafe tool calls, prompt injection and poisoned tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ai", "llm", "agents", "security", "mcp", "prompt-injection", "guardrails", "firewall"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
agent-sentinel = "agent_sentinel.__main__:main"

[tool.setuptools]
packages = ["agent_sentinel"]

# The version lives in one place: agent_sentinel/__init__.py
[tool.setuptools.dynamic]
version = { attr = "agent_sentinel.__version__" }
