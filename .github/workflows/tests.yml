name: tests

on:
  push:
  pull_request:

# The tests only need to read the code. No job gets a token that can write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.10 is the oldest version supported. 3.11 is where exception notes
        # and task groups appear, which some code paths and tests depend on.
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      # Actions are pinned to exact commits so that a moved tag cannot change what runs here.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover tests -v
      # The tests import the package from the folder. This checks that it also installs and starts.
      - run: python -m pip install .
      - run: agent-sentinel --version
