name: tests

on:
  push:
  pull_request:

# The tests only need to read the code. No job gets a token that can write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.10 is the oldest version supported. 3.11 is where exception notes
        # and task groups appear, which some code paths and tests depend on.
        # Every version that pyproject.toml lists in its classifiers is tested.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # Actions are pinned to exact commits so that a moved tag cannot change what runs here.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover tests -v 2>&1 | tee test-output.txt
      # A failed run shows only "exit code 1" on the run's summary page, and the log
      # itself can be downloaded only by someone with admin rights to the repository.
      # This turns each failure into an annotation, which anyone can read on that page.
      - name: say what failed
        if: failure()
        shell: bash
        run: |
          python - <<'REPORT'
          import re

          try:
              lines = open("test-output.txt", encoding="utf-8", errors="replace").read().splitlines()
          except OSError as problem:
              print(f"::error title=no test output::{problem}")
              raise SystemExit(0)

          def annotate(title, detail):
              clean = "%0A".join(part.replace("\r", "") for part in detail[:20])
              for old, new in (("%", "%25"), ("\r", "%0D")):
                  title = title.replace(old, new)
              print(f"::error title={title[:200]}::{clean[:3000]}")

          failures, block, head = [], [], None
          for line in lines:
              if line.startswith(("FAIL: ", "ERROR: ")):
                  if head:
                      failures.append((head, block))
                  head, block = line, []
              elif head is not None:
                  if set(line.strip()) in ({"="}, {"-"}) and len(line.strip()) > 10:
                      continue
                  if line.startswith(("Ran ", "OK", "FAILED")):
                      failures.append((head, block))
                      head, block = None, []
                  elif line.strip():
                      block.append(line.rstrip())
          if head:
              failures.append((head, block))

          for head, block in failures[:20]:
              annotate(head, block[-12:] or ["(no detail)"])
          if len(failures) > 20:
              print(f"::error title=and more::{len(failures) - 20} further failures are in the log")

          summary = [line for line in lines if re.match(r"^(Ran \d+ tests|FAILED|OK)", line)]
          if summary:
              annotate("result", summary[-2:])
          REPORT
      # The tests import the package from the folder. This checks that it also installs and starts.
      - run: python -m pip install .
      - run: agent-sentinel --version
